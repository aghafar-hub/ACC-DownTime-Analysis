<linearGradient id="silo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#162f4b"/><stop offset=".3" stop-color="#4a77a3"/><stop offset=".6" stop-color="#2a4d73"/><stop offset="1" stop-color="#11243a"/></linearGradient>
