<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-label="Cement plant: preheater tower, rotary kiln and silos, with a rising trend line over falling downtime bars">
<title>Cement plant with downtime trend</title>
<style>
.pt{transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
 .bar{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
 .ln{animation:draw 1.8s .3s ease-out both}
 .pt{animation:pop .5s ease-out both}
 .glow{animation:pulse 3.6s ease-in-out infinite}
}
@keyframes rise{from{transform:scaleY(.05);opacity:0}}
@keyframes draw{from{stroke-dasharray:0 1}to{stroke-dasharray:1 1}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
</style>
