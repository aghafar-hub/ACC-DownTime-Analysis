# Builds the TEST COPY of the app (branch test-site) and publishes it to GitHub Pages.
# Runs on a push to test-site, or by hand (Actions > Deploy test copy > Run workflow).
# The plant system moved to its own repository, ACC-Plant-Management, with its own deploy (2026-10-20).
#
# One-time setup in the repository settings:
#   1. Settings > Pages > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables:
#        TEST_API_URL   the web-app URL of the TEST Apps Script deployment (ends in /exec)
#        LIVE_API_URL   (optional) the live web-app URL, only so this workflow can refuse to mix them up
# The URLs are variables, never files in the repository.
name: Deploy test copy

on:
  push:
    branches: [test-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-site
          path: site

      - name: Check the backend addresses
        env:
          TEST_API_URL: ${{ vars.TEST_API_URL }}
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
        run: |
          if [ -z "$TEST_API_URL" ]; then
            echo "TEST_API_URL is not set. A deployed copy must talk to a real backend, not the demo data."; exit 1
          fi
          if [ -n "$LIVE_API_URL" ] && [ "$TEST_API_URL" = "$LIVE_API_URL" ]; then
            echo "TEST_API_URL equals LIVE_API_URL. The test copy must never use the live backend."; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Test and build the test copy (test-site)
        working-directory: site
        env:
          VITE_API_URL: ${{ vars.TEST_API_URL }}
          VITE_BASE: ./
          VITE_ENV_LABEL: TEST COPY
          VITE_STORAGE_PREFIX: 'acc-dt-test:'
        run: |
          npm ci
          npm run typecheck
          env -u VITE_API_URL -u VITE_ENV_LABEL -u VITE_STORAGE_PREFIX -u VITE_NAV_DENY npm test
          npm run test:backend
          npm run build

      - name: Confirm the build has no demo data or demo accounts
        run: |
          if grep -rl "Demo-Pass-1234" site/dist >/dev/null 2>&1; then
            echo "A build contains demo accounts. VITE_API_URL was not applied."; exit 1
          fi
          if grep -rlE "__accTestUpdate|acc:update-ready" site/dist >/dev/null 2>&1; then
            echo "A build contains the update-banner test hook. It must only exist in the demo build."; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
