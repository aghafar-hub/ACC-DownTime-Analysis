# Builds the TEST COPIES of the app and publishes them to GitHub Pages:
#   <pages address>/        the test copy of the current app   (branch test-site)
#   <pages address>/plant/  the plant-system test copy          (branch claude/plant-system)
# Runs on a push to either branch, or by hand (Actions > Deploy test copy > Run workflow). Both copies are built
# every time because GitHub Pages publishes one site per repository. Keep this file the same on both branches.
#
# One-time setup in the repository settings:
#   1. Settings > Pages > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables:
#        TEST_API_URL   the web-app URL of the TEST Apps Script deployment (ends in /exec)
#        PLANT_API_URL  the web-app URL of the PLANT-SYSTEM Apps Script deployment (its own copy of the database);
#                       while it is not set, /plant/ is not published
#        LIVE_API_URL   (optional) the live web-app URL, only so this workflow can refuse to mix them up
# The URLs are variables, never files in the repository.
name: Deploy test copy

on:
  push:
    branches: [test-site, claude/plant-system]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-site
          path: site

      - uses: actions/checkout@v4
        with:
          ref: claude/plant-system
          path: plant

      - name: Check the backend addresses
        env:
          TEST_API_URL: ${{ vars.TEST_API_URL }}
          PLANT_API_URL: ${{ vars.PLANT_API_URL }}
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
        run: |
          if [ -z "$TEST_API_URL" ]; then
            echo "TEST_API_URL is not set. A deployed copy must talk to a real backend, not the demo data."; exit 1
          fi
          if [ -n "$LIVE_API_URL" ] && [ "$TEST_API_URL" = "$LIVE_API_URL" ]; then
            echo "TEST_API_URL equals LIVE_API_URL. The test copy must never use the live backend."; exit 1
          fi
          if [ -n "$PLANT_API_URL" ]; then
            if [ -n "$LIVE_API_URL" ] && [ "$PLANT_API_URL" = "$LIVE_API_URL" ]; then
              echo "PLANT_API_URL equals LIVE_API_URL. The plant-system copy must never use the live backend."; exit 1
            fi
            if [ "$PLANT_API_URL" = "$TEST_API_URL" ]; then
              echo "PLANT_API_URL equals TEST_API_URL. The plant-system copy needs its own database and backend."; exit 1
            fi
          else
            echo "::warning::PLANT_API_URL is not set: /plant/ is not published this time."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            plant/package-lock.json

      - name: Test and build the test copy (test-site)
        working-directory: site
        env:
          VITE_API_URL: ${{ vars.TEST_API_URL }}
          VITE_BASE: ./
          VITE_ENV_LABEL: TEST COPY
          VITE_STORAGE_PREFIX: 'acc-dt-test:'
          VITE_NAV_DENY: plant
        run: |
          npm ci
          npm run typecheck
          env -u VITE_API_URL -u VITE_ENV_LABEL -u VITE_STORAGE_PREFIX -u VITE_NAV_DENY npm test
          npm run test:backend
          npm run build

      - name: Test and build the plant-system copy (claude/plant-system)
        if: ${{ vars.PLANT_API_URL != '' }}
        working-directory: plant
        env:
          VITE_API_URL: ${{ vars.PLANT_API_URL }}
          VITE_BASE: ./
          VITE_ENV_LABEL: PLANT TEST
          VITE_STORAGE_PREFIX: 'acc-dt-plant:'
        run: |
          npm ci
          npm run typecheck
          env -u VITE_API_URL -u VITE_ENV_LABEL -u VITE_STORAGE_PREFIX -u VITE_NAV_DENY npm test
          npm run test:backend
          npm run build
          cp -r dist ../site/dist/plant

      - name: Confirm the builds have no demo data or demo accounts
        run: |
          if grep -rl "Demo-Pass-1234" site/dist >/dev/null 2>&1; then
            echo "A build contains demo accounts. VITE_API_URL was not applied."; exit 1
          fi
          if grep -rlE "__accTestUpdate|acc:update-ready" site/dist >/dev/null 2>&1; then
            echo "A build contains the update-banner test hook. It must only exist in the demo build."; exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
