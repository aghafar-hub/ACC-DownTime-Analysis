<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ACC Downtime Analysis</title>
    <script>
      // GitHub Pages serves this file for any unknown path. The app uses
      // hash routing, so every page lives at the site root: send the
      // visitor back to it (keeping the first path segment, the repo name).
      var l = window.location;
      l.replace(l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') + '/');
    </script>
  </head>
  <body></body>
</html>
